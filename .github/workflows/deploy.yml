name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Витрина «Что сейчас в витрине» берётся из канала Telegram. Раз в час
  # забираем свежие посты, коммитим и пересобираем — лента живёт сама, без
  # участия человека.
  schedule:
    - cron: "20 * * * *"

permissions:
  # contents: write — шаг обновления ленты коммитит свежие посты обратно.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      # Свежие посты канала. Падение Telegram не должно ронять деплой:
      # скрипт при неудаче ничего не трогает, и сборка идёт с теми постами,
      # что лежат в репозитории.
      - name: Обновить ленту Telegram
        continue-on-error: true
        run: node scripts/fetch-telegram.mjs

      # Результат коммитим: так лента видна в ревью, а следующая сборка
      # переживёт недоступность Telegram.
      - name: Закоммитить ленту, если изменилась
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain content/telegram-feed.json public/telegram)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/telegram-feed.json public/telegram
            git commit -m "Лента Telegram: свежие посты канала"
            git push
          else
            echo "лента не менялась"
          fi

      # Сайт живёт в подкаталоге /goldmean.ru — без basePath все внутренние
      # ссылки и статика дадут 404.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /goldmean.ru

      # На Pages нет обработки 404 из Next — кладём заглушку от Jekyll подальше
      # и отдаём каталог как есть.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
